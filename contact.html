    <link rel="stylesheet" href="contact.css">
    <style>
        .contact-box {
            max-width: 500px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            border: 1px solid #f0e0e0;
            text-align: center;
        }
        h1 {
            color: #5a4a4a;
            margin-bottom: 20px;
        }
        label {
            display: block;
            text-align: left;
            color: #7a5a5a;
            margin-top: 12px;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #f0d0d0;
            border-radius: 6px;
            font-family: inherit;
        }
        button {
            background: #fff0f0;
            border: 1px solid #f0d0d0;
            padding: 10px 25px;
            border-radius: 25px;
            margin-top: 20px;
            cursor: pointer;
            color: #7a5a5a;
        }
        button:hover {
            background: #ffe8e8;
        }
        .info {
            margin-top: 25px;
            color: #8a6e6e;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div style="background: #fff5f5; padding: 15px 0; text-align: center; border-bottom: 1px solid #f0dfdf;">

        <a href="contact.html" style="margin: 0 10px; color: #7a5a5a; text-decoration: none;">Contact</a>
    </div>

    <div class="contact-box">
        <h1>Contact Me</h1>
        
        <form>
            <label>Name</label>
            <input type="text" name="name" placeholder="Your name">
            
            <label>Email</label>
            <input type="email" name="email" placeholder="Your email">
            
            <label>Message</label>
            <textarea rows="4" name="message" placeholder="Write your message here..."></textarea>
            
            <button type="submit">Send Message</button>
        </form>
